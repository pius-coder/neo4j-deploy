services:
  neo4j:
    image: neo4j:latest
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_logs:/logs
      - neo4j_config:/config
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - SERVICE_URL_BROWSER=http://neo4j.globalimex.online:7474
      - SERVICE_URL_BOLT=http://bolt.globalimex.online:7687
      - NEO4J_server_default__advertised__address=bolt.globalimex.online
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687

volumes:
  neo4j_logs:
  neo4j_config:
  neo4j_data:
  neo4j_plugins:
